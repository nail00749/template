services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
        VITE_POLICY_ENGINE_API_BASE_URL: ${VITE_POLICY_ENGINE_API_BASE_URL:?VITE_POLICY_ENGINE_API_BASE_URL is required}
        VITE_AUTH_HEADER: ${VITE_AUTH_HEADER:?VITE_AUTH_HEADER is required}
        VITE_ADMIN_ROLE_NAME: ${VITE_ADMIN_ROLE_NAME:?VITE_ADMIN_ROLE_NAME is required}
        SERVER_URL: ${SERVER_URL:-http://localhost:3000}
        SERVER_POLICY_ENGINE_API_BASE_URL: ${SERVER_POLICY_ENGINE_API_BASE_URL:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
      VITE_POLICY_ENGINE_API_BASE_URL: ${VITE_POLICY_ENGINE_API_BASE_URL:?VITE_POLICY_ENGINE_API_BASE_URL is required}
      VITE_AUTH_HEADER: ${VITE_AUTH_HEADER:?VITE_AUTH_HEADER is required}
      VITE_ADMIN_ROLE_NAME: ${VITE_ADMIN_ROLE_NAME:?VITE_ADMIN_ROLE_NAME is required}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      SERVER_POLICY_ENGINE_API_BASE_URL: ${SERVER_POLICY_ENGINE_API_BASE_URL:-}
