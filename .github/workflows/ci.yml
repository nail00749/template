name: CI

on:
  pull_request:
    paths:
      - 'scaffold/**'
      - 'template.manifest.json'
      - 'package.json'
      - 'bun.lock'
      - 'tanstack-start/**'
      - '.github/workflows/ci.yml'
      - 'renovate.json5'
  push:
    paths:
      - 'scaffold/**'
      - 'template.manifest.json'
      - 'package.json'
      - 'bun.lock'
      - 'tanstack-start/**'
      - '.github/workflows/ci.yml'
      - 'renovate.json5'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install CLI dependencies
        run: bun ci --ignore-scripts
      - name: Test gvozdla and legacy scaffold
        run: bun run test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tanstack-start
    env:
      SERVER_URL: http://localhost:3000
      VITE_API_BASE_URL: http://localhost:8002

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tanstack-start/package.json

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Audit dependencies
        run: bun audit

      - name: Check formatting and lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        env:
          NODE_ENV: production
        run: bun run build
